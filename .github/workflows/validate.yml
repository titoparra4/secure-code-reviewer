name: validate

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest]
        python-version: ["3.11", "3.12", "3.13"]
        include:
          # Python 3.9 (minimum supported) is not provided for newer Ubuntu images
          - os: ubuntu-24.04
            python-version: "3.9"
    steps:
      - uses: actions/checkout@v5
        with:
          persist-credentials: false
      - uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install test dependencies
        run: python -m pip install -r requirements-dev.txt
      - name: Validate skill package
        run: python scripts/validate_skill.py --strict
      - name: Run tests
        run: python -m pytest -q
      - name: Examples match current implementation
        run: make examples-check
